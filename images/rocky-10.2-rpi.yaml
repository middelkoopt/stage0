# Rocky Linux 10.2 SBC image for Raspberry Pi (no UEFI shim). Facts behind
# these settings: docs/images.md.
url: https://dl.rockylinux.org/pub/rocky/10/images/aarch64/Rocky-10-SBC-RaspberryPi-10.2-20260525.0.aarch64.raw.xz
sha256: d2b20199e4bf356e725690e5520ca559ee918187cab4bc6a57d757b7f92d1a70

# The shipped cmdline.txt names the root by LABEL, which a Pi 5 can't
# resolve without an initramfs; this one names partition 3 by PARTUUID.
cmdline: console=tty1 console=serial0,115200 root=PARTUUID=ae437f98-7402-4a21-9752-30303d4a7a8a rootfstype=ext4 rootwait

# A Pi 4's GPIO serial console (serial0) is off without enable_uart; the
# image's config.txt doesn't set it.
config:
  - enable_uart=1
