# Stage0 site configuration. Credentials go in .secrets (git-ignored, mode
# 600), keyed by the switch name used here.

# Public keys that may log in to installed nodes as root: the stage0@pilab
# lab key (private half in ~/.cache/stage0/ssh on pilab) and the human's.
sshKeys:
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKZy0O24eEGhCIjhD/f/ARp+HXk7mQqud0uC6cWuIiup stage0@pilab
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIF2JnbcdZKinoEd5t48r0+Nf91U5KAA2toDkNvs/hYea mtim@pilab

switches:
  - name: switch
    address: switch.coffee.lan

# Nodes are named by their switch port label. Consoles use /dev/serial/by-id
# paths, which stay put across reboots and replugging.
nodes:
  - name: k52
    disk: mmcblk0
    console:
      device: /dev/serial/by-id/usb-Raspberry_Pi_Debug_Probe__CMSIS-DAP__E661640843924C33-if01
  - name: k400
    disk: mmcblk0
    console:
      device: /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0

# Provisioning networks stage0 serves (DHCPv4 + TFTP). The host's interface
# must already carry the address; stage0 doesn't configure the host.
networks:
  - name: pinet
    interface: eth0.3
    address: 10.0.3.1/24
    pool: 10.0.3.100-10.0.3.199
    vlan: pinet
    prefix6: fd00:10:3::/64
